<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlogSpace - Read, Learn, Grow</title>
    <script src="https://cdn.tailwindcss.com/" before=""></script>
    <style>
      .tailwind-warning {
        display: none !important;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

      body {
        font-family: "Inter", sans-serif;
      }

      .blog-content {
        font-size: 1.125rem;
        line-height: 1.75;
        color: #374151;
      }

      .blog-content h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-top: 2rem;
        margin-bottom: 1rem;
        color: #111827;
      }

      .blog-content h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        color: #1f2937;
      }

      .blog-content p {
        margin-bottom: 1.25rem;
      }

      .blog-content ul,
      .blog-content ol {
        margin-bottom: 1.25rem;
        padding-left: 1.5rem;
      }

      .blog-content li {
        margin-bottom: 0.5rem;
      }

      .fade-in {
        animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .loading-spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
      <div class="container mx-auto px-4 py-4">
        <div class="flex justify-between items-center">
          <a
            href="/"
            class="text-2xl font-bold text-blue-600 hover:text-blue-700 transition"
          >
            <i class="fas fa-blog mr-2"></i>BlogSpace
          </a>
          <div class="space-x-4">
            <a href="/" class="text-gray-700 hover:text-blue-600 transition"
              >Home</a
            >
            <a
              href="#"
              id="aboutLink"
              class="text-gray-700 hover:text-blue-600 transition"
              >About</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="app" class="container mx-auto px-4 py-8 max-w-4xl">
      <!-- Dynamic content will be injected here -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-16">
      <div class="container mx-auto px-4 py-6 text-center text-gray-600">
        <p>&copy; 2026 BlogSpace. All rights reserved.</p>
      </div>
    </footer>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
